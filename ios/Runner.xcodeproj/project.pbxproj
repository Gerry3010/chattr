			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# ITMS-91061: webcrypto.framework (bundled BoringSSL / openssl_grpc) ships no\n# privacy manifest. Inject a minimal, accurate one and re-sign the framework\n# so the app's outer signature (applied by Xcode after this phase) stays valid.\nset -eu\nFRAMEWORK=\"${CODESIGNING_FOLDER_PATH}/Frameworks/webcrypto.framework\"\nMANIFEST=\"${SRCROOT}/PrivacyManifests/webcrypto-PrivacyInfo.xcprivacy\"\nif [ ! -d \"${FRAMEWORK}\" ]; then\n  echo \"note: webcrypto.framework not found at ${FRAMEWORK}; skipping\"\n  exit 0\nfi\nif [ ! -f \"${MANIFEST}\" ]; then\n  echo \"error: manifest source missing at ${MANIFEST}\" >&2\n  exit 1\nfi\ncp \"${MANIFEST}\" \"${FRAMEWORK}/PrivacyInfo.xcprivacy\"\necho \"Injected PrivacyInfo.xcprivacy into webcrypto.framework\"\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n  codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"${FRAMEWORK}\"\n  echo \"Re-signed webcrypto.framework with ${EXPANDED_CODE_SIGN_IDENTITY}\"\nelse\n  echo \"note: code signing not configured; framework left as-is\"\nfi\n";
