# api.chattr.geraldhofbauer.net → Supabase Kong (127.0.0.1:__KONG_HTTP_PORT__)
# Replace __KONG_HTTP_PORT__ with KONG_HTTP_PORT from the stack .env.
# Cert pre-issued via DNS-01 before the DNS flip (no cert gap at cutover).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name api.chattr.geraldhofbauer.net;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.chattr.geraldhofbauer.net;

    ssl_certificate     /etc/letsencrypt/live/api.chattr.geraldhofbauer.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chattr.geraldhofbauer.net/privkey.pem;

    # Large E2E media + chunk uploads (must match FILE_SIZE_LIMIT = 500 MiB).
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:__KONG_HTTP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime WebSockets (Phoenix channels through Kong):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
