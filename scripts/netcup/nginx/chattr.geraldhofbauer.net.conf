# chattr.geraldhofbauer.net → landing page (static, /home/chattr/app/landing)
server {
    listen 80;
    listen [::]:80;
    server_name chattr.geraldhofbauer.net;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chattr.geraldhofbauer.net;

    ssl_certificate     /etc/letsencrypt/live/chattr.geraldhofbauer.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chattr.geraldhofbauer.net/privkey.pem;

    root /home/chattr/app/landing;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
